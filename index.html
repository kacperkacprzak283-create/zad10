
<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Miasta i herby</title>

    <style>
        body {
            font-family: Arial;
        }

        h1 {
            margin-left: 50px;
        }

        table {
            border: 3px double gray;
            border-collapse: collapse;
            width: 500px;
            margin-left: 50px;
        }

        td {
            border: 3px double gray;
            padding: 3px;
        }

        td:first-child {
            width: 100px;
        }

        img {
            width: 380px;
            height: 220px;
            object-fit: contain;
        }
    </style>
</head>
<body>

    <h1>Miasta i herby</h1>

    <table>
        <tr>
            <td>Katowice</td>
            <td>
                <img src="katowice.webp" alt="Herb Katowic">
            </td>
        </tr>

        <tr>
            <td>Chorzów</td>
            <td>
                <img src="chorzow.webp" alt="Herb Chorzowa">
            </td>
        </tr>

        <tr>
            <td>Mysłowice</td>
            <td>
                <img src="myslowice.webp" alt="Herb Mysłowic">
            </td>
        </tr>

        <tr>
            <td>Kraków</td>
            <td>
                <img src="krakow.webp" alt="Herb Krakowa">
            </td>
        </tr>
    </table>

</body>
</html>
